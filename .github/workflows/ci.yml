name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions: {contents: read}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolkit:
    name: V2 core validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm run check:v2
      - run: npm run check:docs
      - run: npm run test:v2
      - run: npm run check:antigravity-projection
      - run: npm run build:runtimes
      - run: npm run check:antigravity
      - run: npm run test:antigravity
      - run: npm run build:antigravity-plugin

  cli:
    name: CLI tests and package validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: cli}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm, cache-dependency-path: cli/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - name: Smoke packaged CLI lifecycle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          AG_KIT_SMOKE_REF: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_TGZ="$(npm pack --silent)"
          PREFIX="$(mktemp -d)"
          PROJECT="$(mktemp -d)"
          trap 'rm -rf "$PREFIX" "$PROJECT"; rm -f "$PACKAGE_TGZ"' EXIT

          npm install --prefix "$PREFIX" "$PWD/$PACKAGE_TGZ" >/dev/null
          CLI="$PREFIX/node_modules/.bin/ag-kit"

          "$CLI" --version >/dev/null

          mkdir -p "$PROJECT/.agents"
          printf '%s\n' 'keep-user-file' > "$PROJECT/.agents/user-owned.txt"

          "$CLI" init --path "$PROJECT" --branch "$AG_KIT_SMOKE_REF" --quiet --force
          test -f "$PROJECT/.agents/skills/ag-core/SKILL.md"
          test -f "$PROJECT/.agents/agents/scout.md"
          test ! -d "$PROJECT/.agents/workflows"
          grep -q '^keep-user-file$' "$PROJECT/.agents/user-owned.txt"

          "$CLI" update --path "$PROJECT" --branch "$AG_KIT_SMOKE_REF" --quiet --force
          grep -q '^keep-user-file$' "$PROJECT/.agents/user-owned.txt"
          "$CLI" status --path "$PROJECT" --quiet >/dev/null
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Web lint, typecheck, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
