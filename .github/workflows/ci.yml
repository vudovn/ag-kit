name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions: {contents: read}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolkit:
    name: V2 core validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm run check:v2
      - run: npm run test:v2
      - run: npm run check:antigravity-projection
      - run: npm run build:runtimes
      - run: npm run check:antigravity
      - run: npm run test:antigravity
      - run: npm run build:antigravity-plugin

  cli:
    name: CLI tests and package validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: cli}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm, cache-dependency-path: cli/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Web lint, typecheck, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
