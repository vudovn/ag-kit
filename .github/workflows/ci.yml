name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions: {contents: read}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolkit:
    name: V2 core validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm run check:v2
      - run: npm run check:docs
      - run: npm run test:v2
      - name: Run deterministic v2 benchmark receipt
        run: npm run benchmark:v2 -- --output dist/evidence/benchmark-v2.json
      - name: Upload deterministic benchmark receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ag-kit-v2-benchmark-${{ github.sha }}
          path: dist/evidence/benchmark-v2.json
          if-no-files-found: error
          retention-days: 14
      - run: npm run check:runtimes
      - run: npm run test:runtimes
      - run: npm run build:runtimes
      - run: npm run build:runtime-artifacts

  cli:
    name: CLI tests and package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: cli}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm, cache-dependency-path: cli/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - name: Smoke packaged CLI lifecycle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          AG_KIT_SMOKE_REF: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_TGZ="$(npm pack --silent)"
          PREFIX="$(mktemp -d)"
          LEGACY_PROJECT="$(mktemp -d)"
          RUNTIME_ROOT="$(mktemp -d)"
          trap 'rm -rf "$PREFIX" "$LEGACY_PROJECT" "$RUNTIME_ROOT"; rm -f "$PACKAGE_TGZ"' EXIT
          npm install --prefix "$PREFIX" "$PWD/$PACKAGE_TGZ" >/dev/null
          CLI="$PREFIX/node_modules/.bin/ag-kit"
          "$CLI" --version >/dev/null

          # Legacy managed-tree migration remains non-destructive.
          mkdir -p "$LEGACY_PROJECT/.agents"
          printf '%s\n' 'keep-user-file' > "$LEGACY_PROJECT/.agents/user-owned.txt"
          "$CLI" init --path "$LEGACY_PROJECT" --branch "$AG_KIT_SMOKE_REF" --quiet --force
          test -f "$LEGACY_PROJECT/.agents/skills/ag-core/SKILL.md"
          test -f "$LEGACY_PROJECT/.agents/agents/scout.md"
          test ! -d "$LEGACY_PROJECT/.agents/workflows"
          grep -q '^keep-user-file$' "$LEGACY_PROJECT/.agents/user-owned.txt"
          "$CLI" update --path "$LEGACY_PROJECT" --branch "$AG_KIT_SMOKE_REF" --quiet --force
          grep -q '^keep-user-file$' "$LEGACY_PROJECT/.agents/user-owned.txt"
          "$CLI" status --path "$LEGACY_PROJECT" --quiet >/dev/null

          # Exercise representative runtime ownership shapes through the real npm binary.
          for RUNTIME in antigravity claude codex; do
            PROJECT="$RUNTIME_ROOT/$RUNTIME"
            mkdir -p "$PROJECT"
            case "$RUNTIME" in
              antigravity)
                mkdir -p "$PROJECT/.agents"
                printf '%s\n' 'restore-after-runtime-uninstall' > "$PROJECT/.agents/user-owned.txt"
                ;;
              claude)
                mkdir -p "$PROJECT/.claude"
                printf '%s\n' 'restore-after-runtime-uninstall' > "$PROJECT/.claude/user-owned.txt"
                ;;
              codex)
                printf '%s\n' 'user-owned AGENTS instructions' > "$PROJECT/AGENTS.md"
                ;;
            esac

            "$CLI" memory init --path "$PROJECT" >/dev/null
            "$CLI" runtime install "$RUNTIME" --path "$PROJECT" --branch "$AG_KIT_SMOKE_REF" > "$PROJECT/runtime-install.json"
            test -f "$PROJECT/.ag-kit/runtime-installs/$RUNTIME.json"
            "$CLI" runtime doctor "$RUNTIME" --path "$PROJECT" > "$PROJECT/runtime-doctor.json"
            grep -q '"status": "live"' "$PROJECT/runtime-doctor.json"
            "$CLI" runtime uninstall "$RUNTIME" --path "$PROJECT" > "$PROJECT/runtime-uninstall.json"
            test -d "$PROJECT/.ag-kit/memory"
            "$CLI" runtime doctor "$RUNTIME" --path "$PROJECT" > "$PROJECT/runtime-after-uninstall.json"
            grep -q '"status": "untouched"' "$PROJECT/runtime-after-uninstall.json"

            case "$RUNTIME" in
              antigravity) grep -q '^restore-after-runtime-uninstall$' "$PROJECT/.agents/user-owned.txt" ;;
              claude) grep -q '^restore-after-runtime-uninstall$' "$PROJECT/.claude/user-owned.txt" ;;
              codex) grep -q '^user-owned AGENTS instructions$' "$PROJECT/AGENTS.md" ;;
            esac
          done
      - run: npm audit --omit=dev --audit-level=high

  cli-windows:
    name: CLI Windows compatibility
    runs-on: windows-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: cli}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm, cache-dependency-path: cli/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  web:
    name: Web lint, typecheck, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
