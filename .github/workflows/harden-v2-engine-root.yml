name: Harden V2 Engine Root

on:
  push:
    branches:
      - feat/lean-multiruntime-v2
    paths:
      - .github/workflows/harden-v2-engine-root.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/lean-multiruntime-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply exact v2-engine root guard migration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'cli/lib/v2-engine.js';
          let text = fs.readFileSync(file, 'utf8');
          const replacements = [
            [
              'import { createRequire } from "node:module";\n\nconst require = createRequire(import.meta.url);',
              'import { createRequire } from "node:module";\nimport { resolveSafeProjectRoot, stateRoot } from "./project-state.js";\n\nconst require = createRequire(import.meta.url);'
            ],
            [
              'const stateRoot = (root = process.cwd()) => path.join(path.resolve(root), ".ag-kit");\n',
              ''
            ],
            [
              '    const target = path.resolve(targetRoot);\n    const shared = path.join(source, "shared");',
              '    const target = resolveSafeProjectRoot(targetRoot);\n    const shared = path.join(source, "shared");'
            ],
          ];
          for (const [from, to] of replacements) {
            const count = text.split(from).length - 1;
            if (count !== 1) {
              console.error(`Expected one exact match, found ${count}: ${from.slice(0, 90)}`);
              process.exit(1);
            }
            text = text.replace(from, to);
          }
          fs.writeFileSync(file, text);
          NODE
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- cli/lib/v2-engine.js; then
            echo "No migration needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/lib/v2-engine.js
          git commit -m "fix(safety): apply project root guard across v2 engine"
          git push origin HEAD:feat/lean-multiruntime-v2
