name: Synchronize AG Kit Managed Metadata

on:
  pull_request:
    paths:
      - '.agents/**'
      - '.github/workflows/antigravity.yml'

permissions:
  contents: write

concurrency:
  group: sync-agkit-managed-metadata
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'automation/agkit-next-20260729'
    name: Regenerate and validate managed metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out automation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: automation/agkit-next-20260729
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Regenerate managed metadata
        run: |
          python .agents/scripts/generate_manifest.py .agents
          python .agents/scripts/dependency_graph.py .agents

      - name: Validate synchronized toolkit
        run: |
          python .agents/scripts/generate_manifest.py .agents --check
          python .agents/scripts/dependency_graph.py .agents --check
          python .agents/scripts/validate_kit.py .agents
          python -m unittest discover -s .agents/scripts/tests -v
          python -m compileall -q .agents

      - name: Commit generated metadata when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/manifest.json .agents/manifest.lock.json .agents/DEPENDENCY_GRAPH.md
          if git diff --cached --quiet; then
            echo 'Managed metadata already synchronized.'
            exit 0
          fi
          git commit -m 'chore(agents): refresh managed integrity metadata'
          git push origin HEAD:automation/agkit-next-20260729
