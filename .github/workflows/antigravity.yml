name: Antigravity Compatibility

on:
  pull_request:
    paths: ['.agents/**','shared/**','scripts/sync-antigravity-projection.mjs','package.json','.github/workflows/antigravity.yml']
  push:
    branches: [main]
    paths: ['.agents/**','shared/**','scripts/sync-antigravity-projection.mjs','package.json','.github/workflows/antigravity.yml']

permissions:
  contents: read

jobs:
  antigravity:
    name: Antigravity native contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Check generated Antigravity projection
        run: node scripts/sync-antigravity-projection.mjs --check
      - name: Run Antigravity doctor
        run: node .agents/hooks/antigravity-doctor.mjs
      - name: Run Antigravity regression tests
        run: node --test .agents/hooks/tests/antigravity.test.mjs
      - name: Build native Antigravity plugin bundle
        run: node .agents/hooks/build-plugin.mjs --output .tmp/antigravity-plugin
      - name: Verify plugin inventory
        run: |
          test -f .tmp/antigravity-plugin/plugin.json
          test -f .tmp/antigravity-plugin/PLUGIN_CONTENTS.json
          test -f .tmp/antigravity-plugin/hooks.json
          test -f .tmp/antigravity-plugin/skills/ag-core/SKILL.md
          test -f .tmp/antigravity-plugin/agents/scout.md
