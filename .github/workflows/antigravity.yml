name: Antigravity Compatibility

on:
  pull_request:
    paths:
      - '.agents/**'
      - 'package.json'
      - 'cli/package.json'
      - 'web/package.json'
      - 'README.md'
      - 'README-VI.md'
      - 'MIGRATION.md'
      - 'PRODUCTION_CHECKLIST.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'AGENT_FLOW.md'
      - '.github/RELEASE_SETUP.md'
      - '.github/workflows/antigravity.yml'
  push:
    branches: [main]
    paths:
      - '.agents/**'
      - 'package.json'
      - 'cli/package.json'
      - 'web/package.json'
      - 'README.md'
      - 'README-VI.md'
      - 'MIGRATION.md'
      - 'PRODUCTION_CHECKLIST.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'AGENT_FLOW.md'
      - '.github/RELEASE_SETUP.md'
      - '.github/workflows/antigravity.yml'

permissions:
  contents: read

jobs:
  antigravity:
    name: Antigravity native contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run Antigravity doctor
        run: node .agents/hooks/antigravity-doctor.mjs

      - name: Run Antigravity regression tests
        run: node --test .agents/hooks/tests/antigravity.test.mjs

      - name: Build Antigravity plugin bundle
        run: node .agents/hooks/build-plugin.mjs --output .tmp/antigravity-plugin

      - name: Verify plugin inventory
        run: |
          test -f .tmp/antigravity-plugin/gemini-extension.json
          test -f .tmp/antigravity-plugin/PLUGIN_CONTENTS.json
          test -f .tmp/antigravity-plugin/commands/ag-kit/orchestrate.toml
          test -f .tmp/antigravity-plugin/hooks/hooks.json
