name: Regenerate CLI Lock (temporary migration)

on:
  push:
    branches: ["feat/lean-multiruntime-v2"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/lean-multiruntime-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Regenerate lockfile
        working-directory: cli
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- cli/package-lock.json; then exit 0; fi
          git config user.name "ag-kit-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/package-lock.json
          git commit -m "chore(cli): regenerate package lock"
          git push origin HEAD:feat/lean-multiruntime-v2
