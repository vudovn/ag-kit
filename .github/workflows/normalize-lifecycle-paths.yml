name: Normalize Lifecycle Paths

on:
  push:
    branches:
      - feat/lean-multiruntime-v2
    paths:
      - .github/workflows/normalize-lifecycle-paths.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/lean-multiruntime-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Normalize machine-readable lifecycle paths
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'cli/lib/runtime-lifecycle.js';
          let text = fs.readFileSync(file, 'utf8');
          const replacements = [
            [
              'const timestamp = () => new Date().toISOString().replace(/[:.]/g, "-");\n',
              'const timestamp = () => new Date().toISOString().replace(/[:.]/g, "-");\nconst portableRelative = (root, target) => path.relative(root, target).split(path.sep).join("/");\n'
            ],
            [
              'return { relativePath, strategy, before, backup: backup ? path.relative(projectRoot, backup) : null };',
              'return { relativePath, strategy, before, backup: backup ? portableRelative(projectRoot, backup) : null };'
            ],
            [
              'return { schema: 1, id, runtime, root: projectRoot, preparedAt: new Date().toISOString(), backupRoot: path.relative(projectRoot, backupRoot), entries };',
              'return { schema: 1, id, runtime, root: projectRoot, preparedAt: new Date().toISOString(), backupRoot: portableRelative(projectRoot, backupRoot), entries };'
            ],
            [
              'return { runtime, status: results.some((item) => item.drift) ? "uninstalled-with-preserved-drift" : "uninstalled", memoryPreserved: true, receipt: path.relative(projectRoot, receipt), results };',
              'return { runtime, status: results.some((item) => item.drift) ? "uninstalled-with-preserved-drift" : "uninstalled", memoryPreserved: true, receipt: portableRelative(projectRoot, receipt), results };'
            ]
          ];
          for (const [from, to] of replacements) {
            const count = text.split(from).length - 1;
            if (count !== 1) {
              console.error(`Expected exactly one match, found ${count}: ${from.slice(0, 100)}`);
              process.exit(1);
            }
            text = text.replace(from, to);
          }
          fs.writeFileSync(file, text);
          NODE
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet -- cli/lib/runtime-lifecycle.js; then
            echo "No normalization needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/lib/runtime-lifecycle.js
          git commit -m "fix(runtime): normalize lifecycle output paths"
          git push origin HEAD:feat/lean-multiruntime-v2
