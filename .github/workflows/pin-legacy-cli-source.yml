name: Pin Legacy CLI Source

on:
  push:
    branches:
      - feat/lean-multiruntime-v2
    paths:
      - .github/workflows/pin-legacy-cli-source.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/lean-multiruntime-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply exact legacy source pin migration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'cli/bin/index.js';
          let text = fs.readFileSync(file, 'utf8');
          const replacements = [
            [
              '} from "../lib/managed-tree.js";\n',
              '} from "../lib/managed-tree.js";\nimport { runtimeSourceSpec } from "../lib/source-spec.js";\n'
            ],
            [
              'const REPO = "github:vudovn/ag-kit";\n',
              ''
            ],
            [
              '    const repoSource = branch ? `${REPO}#${branch}` : REPO;\n',
              '    const repoSource = runtimeSourceSpec(branch);\n'
            ],
          ];
          for (const [from, to] of replacements) {
            const count = text.split(from).length - 1;
            if (count !== 1) {
              console.error(`Expected one exact match, found ${count}: ${from.slice(0, 100)}`);
              process.exit(1);
            }
            text = text.replace(from, to);
          }
          fs.writeFileSync(file, text);
          NODE
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- cli/bin/index.js; then
            echo "No migration needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/bin/index.js
          git commit -m "fix(cli): pin legacy init/update source to release tag"
          git push origin HEAD:feat/lean-multiruntime-v2
