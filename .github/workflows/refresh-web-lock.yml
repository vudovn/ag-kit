name: Refresh Web Lock

on:
  push:
    branches:
      - feat/lean-multiruntime-v2
    paths:
      - web/package.json
      - .github/workflows/refresh-web-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/lean-multiruntime-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Refresh lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo "web/package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "chore(web): refresh dependency lock"
          git push origin HEAD:feat/lean-multiruntime-v2
