name: Qwen Prompt Hook Migration

on:
  push:
    branches: [feat/lean-multiruntime-v2]
    paths:
      - .github/workflows/qwen-prompt-hook-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/lean-multiruntime-v2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Patch verified Qwen UserPromptSubmit support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}')
              p.write_text(text.replace(old, new, count))

          replace_exact(
              'cli/lib/prompt-hook.js',
              'const SUPPORTED = new Set(["claude", "gemini"]);',
              'const SUPPORTED = new Set(["claude", "gemini", "qwen"]);'
          )
          replace_exact(
              'cli/lib/prompt-hook.js',
              '  const prompt = String(payload.prompt ?? payload.user_prompt ?? "");\n  const result = checkPromptQuality(prompt);\n\n  if (runtime === "gemini") {',
              '  const prompt = runtime === "qwen"\n    ? String(payload.submitted_prompt ?? "")\n    : String(payload.prompt ?? payload.user_prompt ?? "");\n  if (runtime === "qwen" && !prompt.trim()) return { decision: "allow" };\n  const result = checkPromptQuality(prompt);\n\n  if (runtime === "gemini") {'
          )
          replace_exact(
              'cli/lib/prompt-hook.js',
              '  if (result.ok) return { continue: true, suppressOutput: true };\n  return {\n    continue: true,\n    suppressOutput: true,\n    hookSpecificOutput: {\n      hookEventName: "UserPromptSubmit",\n      additionalContext: additionalContext(result),\n    },\n  };',
              '  if (runtime === "qwen") {\n    if (result.ok) return { decision: "allow" };\n    return {\n      decision: "allow",\n      hookSpecificOutput: {\n        hookEventName: "UserPromptSubmit",\n        additionalContext: additionalContext(result),\n      },\n    };\n  }\n\n  if (result.ok) return { continue: true, suppressOutput: true };\n  return {\n    continue: true,\n    suppressOutput: true,\n    hookSpecificOutput: {\n      hookEventName: "UserPromptSubmit",\n      additionalContext: additionalContext(result),\n    },\n  };'
          )
          replace_exact(
              'cli/lib/prompt-hook.js',
              '  if (!SUPPORTED.has(runtime)) throw new Error("usage: ag-kit prompt-hook <claude|gemini>");',
              '  if (!SUPPORTED.has(runtime)) throw new Error("usage: ag-kit prompt-hook <claude|gemini|qwen>");'
          )
          replace_exact(
              'cli/lib/prompt-hook.js',
              '    const fallback = runtime === "gemini" ? { decision: "allow" } : { continue: true, suppressOutput: true };',
              '    const fallback = runtime === "claude" ? { continue: true, suppressOutput: true } : { decision: "allow" };'
          )

          replace_exact(
              'cli/lib/runtime-mcp.js',
              '  else if (runtime === "qwen") result = mergeMcp(path.join(target, ".qwen", "settings.json"));',
              '  else if (runtime === "qwen") {\n    result = mergeMcp(path.join(target, ".qwen", "settings.json"));\n    const promptQuality = mergePromptHook({ root: target, file: path.join(target, ".qwen", "settings.json"), runtime, event: "UserPromptSubmit" });\n    return { ...result, file: portableRelative(target, result.file), promptQuality };\n  }'
          )

          replace_exact(
              'cli/lib/runtime-lifecycle.js',
              '  qwen: [[".qwen/skills", "tree"], [".qwen/agents", "tree"], ["QWEN.md", "block"], [".qwen/settings.json", "mcp-json"]],',
              '  qwen: [[".qwen/skills", "tree"], [".qwen/agents", "tree"], ["QWEN.md", "block"], [".qwen/settings.json", "mcp-prompt-hooks-json"]],'
          )
          replace_exact(
              'cli/lib/runtime-lifecycle.js',
              'const promptHookDefinition = (runtime) => runtime === "claude"\n  ? { event: "UserPromptSubmit", command: "ag-kit prompt-hook claude" }\n  : runtime === "gemini"\n    ? { event: "BeforeAgent", command: "ag-kit prompt-hook gemini" }\n    : null;',
              'const promptHookDefinition = (runtime) => runtime === "claude"\n  ? { event: "UserPromptSubmit", command: "ag-kit prompt-hook claude" }\n  : runtime === "gemini"\n    ? { event: "BeforeAgent", command: "ag-kit prompt-hook gemini" }\n    : runtime === "qwen"\n      ? { event: "UserPromptSubmit", command: "ag-kit prompt-hook qwen" }\n      : null;'
          )

          p = Path('cli/test/prompt-hook.test.js')
          text = p.read_text()
          marker = 'test("clear prompts produce no injected prompt-quality context", () => {'
          if text.count(marker) != 1:
              raise SystemExit('prompt-hook.test.js: clear prompt marker drifted')
          qwen_tests = '''test("Qwen UserPromptSubmit uses submitted_prompt provenance and never falls back to model prompt", () => {\n  const ambiguous = promptHookEnvelope("qwen", { submitted_prompt: "make this better", prompt: "expanded model-bound prompt" });\n  assert.equal(ambiguous.decision, "allow");\n  assert.equal(ambiguous.hookSpecificOutput.hookEventName, "UserPromptSubmit");\n  assert.match(ambiguous.hookSpecificOutput.additionalContext, /ask one concise clarification/i);\n  assert.equal(ambiguous.hookSpecificOutput.additionalContext.includes("make this better"), false);\n\n  assert.deepEqual(promptHookEnvelope("qwen", { prompt: "make this better" }), { decision: "allow" });\n  assert.deepEqual(promptHookEnvelope("qwen", { submitted_prompt: "fix cli/lib/foo.js" }), { decision: "allow" });\n});\n\n'''
          p.write_text(text.replace(marker, qwen_tests + marker, 1))

          replace_exact(
              'cli/test/prompt-hook-lifecycle.test.js',
              '  { runtime: "gemini", settings: ".gemini/settings.json", event: "BeforeAgent" },\n];',
              '  { runtime: "gemini", settings: ".gemini/settings.json", event: "BeforeAgent" },\n  { runtime: "qwen", settings: ".qwen/settings.json", event: "UserPromptSubmit" },\n];'
          )
          replace_exact(
              'cli/test/prompt-hook-lifecycle.test.js',
              '      ...(runtime === "gemini" ? { mcpServers: { user: { command: "user-mcp", args: [] } } } : {}),',
              '      ...(["gemini", "qwen"].includes(runtime) ? { mcpServers: { user: { command: "user-mcp", args: [] } } } : {}),'
          )
          replace_exact(
              'cli/test/prompt-hook-lifecycle.test.js',
              '    if (runtime === "gemini") installed.mcpServers.later = { command: "later-mcp", args: [] };',
              '    if (["gemini", "qwen"].includes(runtime)) installed.mcpServers.later = { command: "later-mcp", args: [] };'
          )
          replace_exact(
              'cli/test/prompt-hook-lifecycle.test.js',
              '    if (runtime === "gemini") {\n      assert.equal(Boolean(remaining.mcpServers?.["ag-kit"]), false);',
              '    if (["gemini", "qwen"].includes(runtime)) {\n      assert.equal(Boolean(remaining.mcpServers?.["ag-kit"]), false);'
          )

          p = Path('docs/PARITY_IJFW.md')
          text = p.read_text()
          old = '| Prompt quality gate | deterministic ambiguity check before subjective work | **portable core done** — `prompt-check` + MCP `ag_prompt_check`, multi-signal/low-FP heuristics, no raw-prompt persistence; native pre-prompt interception remains capability-gated |'
          new = '| Prompt quality gate | deterministic ambiguity check before subjective work | **portable core done** — `prompt-check` + MCP `ag_prompt_check`; verified automatic interception is wired for Claude, Gemini, and Qwen, with raw-prompt provenance rules and no raw-prompt persistence |'
          if text.count(old) != 1:
              raise SystemExit('PARITY_IJFW prompt quality row drifted')
          text = text.replace(old, new, 1)
          old2 = '1. wire prompt-quality interception automatically only for runtimes whose user-prompt hook/event contract is current, project-safe, and independently tested;'
          new2 = '1. expand automatic prompt-quality interception beyond Claude, Gemini, and Qwen only when another runtime’s user-prompt hook/event contract is current, project-safe, provenance-safe, and independently tested;'
          if text.count(old2) != 1:
              raise SystemExit('PARITY_IJFW remaining prompt item drifted')
          p.write_text(text.replace(old2, new2, 1))
          PY
      - name: Validate CLI tests
        working-directory: cli
        run: |
          npm ci
          npm test
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/lib/prompt-hook.js cli/lib/runtime-mcp.js cli/lib/runtime-lifecycle.js cli/test/prompt-hook.test.js cli/test/prompt-hook-lifecycle.test.js docs/PARITY_IJFW.md
          git diff --cached --check
          git commit -m "feat(qwen): wire provenance-safe prompt quality hook"
          git push origin HEAD:feat/lean-multiruntime-v2
