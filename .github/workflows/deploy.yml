name: Build & Deploy to CapRover

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  CAPROVER_CLI_VERSION: "2.3.0"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image reference
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_URL=ghcr.io/${repository}:${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install optional CapRover CA certificate
        env:
          CAPROVER_CA_CERT_B64: ${{ secrets.CAPROVER_CA_CERT_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CAPROVER_CA_CERT_B64:-}" ]]; then
            echo "$CAPROVER_CA_CERT_B64" | base64 --decode | sudo tee /usr/local/share/ca-certificates/caprover.crt >/dev/null
            sudo update-ca-certificates
          fi

      - name: Deploy to CapRover
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          APP_NAME: ${{ secrets.APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "caprover@${CAPROVER_CLI_VERSION}" deploy \
            --caproverUrl "$CAPROVER_SERVER" \
            --appToken "$APP_TOKEN" \
            --appName "$APP_NAME" \
            --imageName "$IMAGE_URL"
