name: Deploy to Dokploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Deploy to Dokploy
        env:
          DOKPLOY_AUTH_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_URL_RAW: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          set -euo pipefail
          # Strip trailing slash from URL if present
          export DOKPLOY_URL="${DOKPLOY_URL_RAW%/}"
          npx --yes @dokploy/cli application deploy --applicationId "$DOKPLOY_APPLICATION_ID"
