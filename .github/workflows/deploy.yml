name: Deploy to Dokploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Deploy to Dokploy
        env:
          DOKPLOY_AUTH_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_URL_RAW: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          set -euo pipefail
          # Strip trailing slash from URL if present
          export DOKPLOY_URL="${DOKPLOY_URL_RAW%/}"
          npx --yes @dokploy/cli application deploy --applicationId "$DOKPLOY_APPLICATION_ID"
