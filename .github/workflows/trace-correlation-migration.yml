name: Trace Correlation Migration

on:
  push:
    branches: [feat/lean-multiruntime-v2]
    paths:
      - .github/workflows/trace-correlation-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/lean-multiruntime-v2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply trace correlation migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          Path('cli/lib/trace-context.js').write_text('''import path from "node:path";\nimport { readJson, stateRoot } from "./project-state.js";\n\nconst TRACE_ENV = "AG_KIT_TRACE_ID";\nconst TRACE_PATTERN = /^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$/;\n\nexport const isValidTraceId = (value) => typeof value === "string" && TRACE_PATTERN.test(value);\n\nexport function currentTraceId(root = process.cwd()) {\n    const explicit = process.env[TRACE_ENV];\n    if (isValidTraceId(explicit)) return explicit;\n    const session = readJson(path.join(stateRoot(root), "flow", "session.json"), null);\n    if (session?.status !== "active") return null;\n    const candidate = session.traceId || session.id;\n    return isValidTraceId(candidate) ? candidate : null;\n}\n\nexport function traceFields(root = process.cwd()) {\n    const traceId = currentTraceId(root);\n    return traceId ? { traceId } : {};\n}\n\nexport function traceEnv(root = process.cwd(), extra = {}) {\n    const traceId = currentTraceId(root);\n    return { ...process.env, ...(traceId ? { [TRACE_ENV]: traceId } : {}), ...extra };\n}\n''')

          replace_once('cli/lib/v2-engine.js',
              'import { resolveSafeProjectRoot, stateRoot } from "./project-state.js";\n',
              'import { resolveSafeProjectRoot, stateRoot } from "./project-state.js";\nimport { currentTraceId, traceEnv, traceFields } from "./trace-context.js";\n')
          replace_once('cli/lib/v2-engine.js',
              '    const record = { ts: new Date().toISOString(), type, ...data };',
              '    const record = { ts: new Date().toISOString(), type, ...traceFields(root), ...data };')
          replace_once('cli/lib/v2-engine.js',
              'const result = spawnSync(reviewer.command, reviewer.run(prompt), { cwd: temp, encoding: "utf8", timeout: Number(timeoutMs), shell: false, env: process.env });',
              'const result = spawnSync(reviewer.command, reviewer.run(prompt), { cwd: temp, encoding: "utf8", timeout: Number(timeoutMs), shell: false, env: traceEnv(root) });')
          replace_once('cli/lib/v2-engine.js',
              'const report = { schema: 1, target: snapshot.label, snapshotKind: snapshot.kind, reviewerCount: results.length, lineages: [...lineages], results };',
              'const report = { schema: 1, ...traceFields(root), target: snapshot.label, snapshotKind: snapshot.kind, reviewerCount: results.length, lineages: [...lineages], results };')

          replace_once('cli/lib/workflow-session.js',
              '    const startedAt = new Date().toISOString();\n    const session = {\n        schema: 3,\n        id: `flow-${Date.now()}`,',
              '    const startedAt = new Date().toISOString();\n    const flowId = `flow-${Date.now()}`;\n    const session = {\n        schema: 3,\n        id: flowId,\n        traceId: flowId,')

          replace_once('cli/lib/preflight.js',
              'import { resolveSafeProjectRoot } from "./project-state.js";\n',
              'import { resolveSafeProjectRoot } from "./project-state.js";\nimport { traceEnv } from "./trace-context.js";\n')
          replace_once('cli/lib/preflight.js',
              '            timeout: gate.timeoutMs,\n            shell: false,\n        });',
              '            timeout: gate.timeoutMs,\n            shell: false,\n            env: traceEnv(resolvedRoot),\n        });')

          replace_once('cli/lib/observability.js',
              'import { ensureDir, readJson, readJsonl, stateRoot, writeJson } from "./project-state.js";\n',
              'import { ensureDir, readJson, readJsonl, stateRoot, writeJson } from "./project-state.js";\nimport { traceFields } from "./trace-context.js";\n')
          replace_once('cli/lib/observability.js',
              '  const event = { ts: new Date().toISOString(), runtime, session, kind, inputTokens: num(inputTokens), outputTokens: num(outputTokens), cacheReadTokens: num(cacheReadTokens), savedTokens: num(savedTokens), costUsd: num(costUsd), metadata };',
              '  const event = { ts: new Date().toISOString(), ...traceFields(root), runtime, session, kind, inputTokens: num(inputTokens), outputTokens: num(outputTokens), cacheReadTokens: num(cacheReadTokens), savedTokens: num(savedTokens), costUsd: num(costUsd), metadata };')

          replace_once('cli/lib/efficiency.js',
              'import { appendJsonl, ensureDir, slugify, stateRoot } from "./project-state.js";\n',
              'import { appendJsonl, ensureDir, slugify, stateRoot } from "./project-state.js";\nimport { traceEnv, traceFields } from "./trace-context.js";\n')
          replace_once('cli/lib/efficiency.js',
              '  appendJsonl(receiptFile(root), { ts: new Date().toISOString(), type: "route", ...result });',
              '  appendJsonl(receiptFile(root), { ts: new Date().toISOString(), type: "route", ...traceFields(root), ...result });')
          replace_once('cli/lib/efficiency.js',
              '  const result = spawnSync(resolved.resolvedCommand, args, { cwd: projectRoot, encoding: "utf8", shell: false, timeout: Number(timeoutMs), maxBuffer: 50 * 1024 * 1024, env: process.env });',
              '  const result = spawnSync(resolved.resolvedCommand, args, { cwd: projectRoot, encoding: "utf8", shell: false, timeout: Number(timeoutMs), maxBuffer: 50 * 1024 * 1024, env: traceEnv(projectRoot) });')
          replace_once('cli/lib/efficiency.js',
              '    type: "sandbox-command",\n    command: resolved.requestedCommand,',
              '    type: "sandbox-command",\n    ...traceFields(projectRoot),\n    command: resolved.requestedCommand,')

          Path('cli/test/trace-correlation.test.js').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\nimport os from "node:os";\nimport path from "node:path";\nimport { appendReceipt } from "../lib/v2-engine.js";\nimport { runSandboxedCommand } from "../lib/efficiency.js";\nimport { recordObservation } from "../lib/observability.js";\nimport { runCurrentPreflight } from "../lib/preflight.js";\nimport { currentTraceId } from "../lib/trace-context.js";\nimport { startFlow } from "../lib/workflow-session.js";\n\nconst tempRoot = (t) => {\n    const root = fs.mkdtempSync(path.join(os.tmpdir(), "ag-kit-trace-"));\n    t.after(() => fs.rmSync(root, { recursive: true, force: true }));\n    return root;\n};\n\ntest("active flow trace correlates receipts, observations, preflight children, and sandbox commands", (t) => {\n    const root = tempRoot(t);\n    const flow = startFlow({ root, goal: "trace evidence", mode: "quick" });\n    assert.equal(flow.traceId, flow.id);\n    assert.equal(currentTraceId(root), flow.id);\n\n    const receipt = appendReceipt(root, "trace-test", { action: "check" });\n    assert.equal(receipt.traceId, flow.id);\n    const observation = recordObservation({ root, runtime: "test", kind: "trace" });\n    assert.equal(observation.traceId, flow.id);\n\n    const traceFile = path.join(root, "trace-child.txt");\n    fs.mkdirSync(path.join(root, ".ag-kit"), { recursive: true });\n    fs.writeFileSync(path.join(root, ".ag-kit", "preflight.json"), JSON.stringify({\n        gates: [{ name: "trace-child", command: process.execPath, args: ["-e", `require("fs").writeFileSync(${JSON.stringify(traceFile)}, process.env.AG_KIT_TRACE_ID || "")`] }],\n    }, null, 2));\n    const preflight = runCurrentPreflight(root);\n    assert.equal(preflight.passed, true);\n    assert.equal(fs.readFileSync(traceFile, "utf8"), flow.id);\n\n    const sandbox = runSandboxedCommand({ root, command: process.execPath, args: ["-e", "console.log(process.env.AG_KIT_TRACE_ID || '')"] });\n    assert.equal(sandbox.traceId, flow.id);\n    assert.match(sandbox.summary, new RegExp(flow.id));\n});\n\ntest("trace correlation stays absent when no active flow or explicit trace exists", (t) => {\n    const root = tempRoot(t);\n    assert.equal(currentTraceId(root), null);\n    const receipt = appendReceipt(root, "trace-test", { action: "idle" });\n    assert.equal(Object.hasOwn(receipt, "traceId"), false);\n    const observation = recordObservation({ root, runtime: "test", kind: "idle" });\n    assert.equal(Object.hasOwn(observation, "traceId"), false);\n});\n''')
          PY
      - name: Validate CLI tests
        working-directory: cli
        run: |
          npm ci
          npm test
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/lib cli/test
          git diff --cached --check
          git commit -m "feat(obs): correlate flow evidence with stable traces"
          git push origin HEAD:feat/lean-multiruntime-v2
