name: Migrate Web Docs Copy

on:
  push:
    branches:
      - feat/lean-multiruntime-v2
    paths:
      - web/src/i18n/dictionaries.ts
      - .github/workflows/migrate-web-doc-copy.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/lean-multiruntime-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Replace legacy inventory copy exactly
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'web/src/i18n/dictionaries.ts';
          let text = fs.readFileSync(file, 'utf8');
          const replacements = new Map([
            ['Contains 20 specialist AI agent configurations for different domains (frontend, backend, security, etc.)', '4 permanent core agents; project-specific specialists are generated only when needed'],
            ['47 domain-specific knowledge modules that agents can use', '18 hot-loaded behavior skills plus domain packs loaded only when relevant'],
            ['13 slash command procedures for common development tasks', '1 gated development spine with QUICK, STANDARD, and DEEP modes'],
            ['Discover 47 domain-specific skills', 'Discover 18 hot-loaded skills and domain packs'],
            ['Node.js 18.0 or later', 'Node.js 22.0 or later'],
            ['Chứa 20 cấu hình AI agent chuyên biệt cho các lĩnh vực khác nhau (frontend, backend, bảo mật, v.v.)', '4 core agent cố định; specialist theo dự án chỉ được sinh khi cần'],
            ['47 mô-đun kiến thức theo lĩnh vực mà agent có thể sử dụng', '18 behavior skill tải theo nhu cầu cùng domain pack chỉ load khi liên quan'],
            ['13 thủ tục lệnh gạch chéo cho những tác vụ phát triển thường gặp', '1 development spine có gate với các mode QUICK, STANDARD và DEEP'],
            ['Khám phá 47 kỹ năng theo lĩnh vực', 'Khám phá 18 hot-loaded skill và domain pack'],
            ['Node.js 18.0 trở lên', 'Node.js 22.0 trở lên'],
            ['包含 20 个面向不同领域（前端、后端、安全等）的专业 AI agent 配置', '4 个固定核心 agent；仅在项目需要时生成专业角色'],
            ['47 个 agent 可使用的特定领域知识模块', '18 个按需加载的行为技能，以及仅在相关时加载的领域包'],
            ['13 个用于常见开发任务的斜杠命令流程', '1 条带门控的开发主流程，包含 QUICK、STANDARD 和 DEEP 模式'],
            ['探索 47 个特定领域技能', '探索 18 个按需加载技能和领域包'],
            ['Node.js 18.0 或更高版本', 'Node.js 22.0 或更高版本'],
            ['さまざまな領域（フロントエンド、バックエンド、セキュリティなど）向けの 20 個の専門 AI agent 設定を含みます', '固定コア agent は 4 個。プロジェクト固有の専門家は必要なときだけ生成します'],
            ['agent が使用できる 47 個のドメイン固有の知識モジュール', '必要時に読み込む 18 個の behavior skill と、関連時のみ読み込む domain pack'],
            ['よくある開発タスク向けの 13 個のスラッシュコマンド手順', 'QUICK・STANDARD・DEEP を持つ 1 本のゲート付き development spine'],
            ['47 個のドメイン固有スキルを発見する', '18 個の hot-loaded skill と domain pack を確認する'],
            ['Node.js 18.0 以降', 'Node.js 22.0 以降'],
          ]);
          let changed = 0;
          for (const [from, to] of replacements) {
            if (!text.includes(from)) continue;
            text = text.split(from).join(to);
            changed++;
          }
          if (changed !== replacements.size) {
            console.error(`Expected ${replacements.size} exact replacements, applied ${changed}`);
            process.exit(1);
          }
          fs.writeFileSync(file, text);
          NODE
      - name: Commit migrated copy
        shell: bash
        run: |
          if git diff --quiet -- web/src/i18n/dictionaries.ts; then
            echo "Dictionary already migrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/i18n/dictionaries.ts
          git commit -m "docs(web): migrate legacy inventory copy to v2"
          git push origin HEAD:feat/lean-multiruntime-v2
