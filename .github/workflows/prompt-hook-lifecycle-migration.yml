name: Prompt Hook Lifecycle Migration

on:
  push:
    branches: [feat/lean-multiruntime-v2]
    paths:
      - .github/workflows/prompt-hook-lifecycle-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/lean-multiruntime-v2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Patch lifecycle ownership and runtime wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lifecycle = Path('cli/lib/runtime-lifecycle.js')
          text = lifecycle.read_text()
          replacements = [
            (
              '  claude: [[".claude/skills", "tree"], [".claude/agents", "tree"], ["CLAUDE.md", "block"], [".mcp.json", "mcp-json"]],',
              '  claude: [[".claude/skills", "tree"], [".claude/agents", "tree"], ["CLAUDE.md", "block"], [".mcp.json", "mcp-json"], [".claude/settings.json", "prompt-hooks-json"]],'
            ),
            (
              '  gemini: [[".gemini/skills", "tree"], ["GEMINI.md", "block"], [".gemini/settings.json", "mcp-json"]],',
              '  gemini: [[".gemini/skills", "tree"], ["GEMINI.md", "block"], [".gemini/settings.json", "mcp-prompt-hooks-json"]],'
            ),
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'lifecycle replacement guard failed: {old[:50]}')
            text = text.replace(old, new, 1)

          marker = 'const hasManagedBlock = (file, label = MARKER_LABEL) => {'
          if text.count(marker) != 1:
            raise SystemExit('prompt hook helper insertion marker missing')
          helpers = r'''const promptHookDefinition = (runtime) => runtime === "claude"
  ? { event: "UserPromptSubmit", command: "ag-kit prompt-hook claude" }
  : runtime === "gemini"
    ? { event: "BeforeAgent", command: "ag-kit prompt-hook gemini" }
    : null;

const removePromptHook = (file, runtime) => {
  if (!fs.existsSync(file) || !fs.lstatSync(file).isFile()) return { changed: false, removed: false };
  const definition = promptHookDefinition(runtime);
  if (!definition) return { changed: false, removed: false };
  let data;
  try { data = JSON.parse(fs.readFileSync(file, "utf8")); } catch { return { changed: false, removed: false, invalidJson: true }; }
  const groups = Array.isArray(data?.hooks?.[definition.event]) ? data.hooks[definition.event] : [];
  let changed = false;
  const nextGroups = groups.flatMap((group) => {
    const handlers = Array.isArray(group?.hooks) ? group.hooks : [];
    const kept = handlers.filter((handler) => handler?.command !== definition.command);
    if (kept.length !== handlers.length) changed = true;
    if (!kept.length) return [];
    return [{ ...group, hooks: kept }];
  });
  if (!changed) return { changed: false, removed: false };
  if (nextGroups.length) data.hooks[definition.event] = nextGroups;
  else delete data.hooks[definition.event];
  if (data.hooks && Object.keys(data.hooks).length === 0) delete data.hooks;
  if (Object.keys(data).length === 0) { fs.rmSync(file, { force: true }); return { changed: true, removed: true }; }
  fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
  return { changed: true, removed: false };
};

const hasPromptHook = (file, runtime) => {
  const definition = promptHookDefinition(runtime);
  if (!definition) return false;
  try {
    const data = JSON.parse(fs.readFileSync(file, "utf8"));
    const groups = Array.isArray(data?.hooks?.[definition.event]) ? data.hooks[definition.event] : [];
    return groups.some((group) => Array.isArray(group?.hooks) && group.hooks.some((handler) => handler?.type === "command" && handler.command === definition.command));
  } catch { return false; }
};

'''
          text = text.replace(marker, helpers + marker, 1)

          old_doctor = '    else if (entry.strategy === "mcp-json") { ok = hasMcpEntry(absolute); state = ok ? "wired" : current.exists ? "drift" : "missing"; }\n    else { ok = current.exists && current.digest === entry.after?.digest; state = ok ? "managed" : current.exists ? "drift" : "missing"; }'
          new_doctor = '    else if (entry.strategy === "mcp-json") { ok = hasMcpEntry(absolute); state = ok ? "wired" : current.exists ? "drift" : "missing"; }\n    else if (entry.strategy === "prompt-hooks-json") { ok = hasPromptHook(absolute, runtime); state = ok ? "wired" : current.exists ? "drift" : "missing"; }\n    else if (entry.strategy === "mcp-prompt-hooks-json") { ok = hasMcpEntry(absolute) && hasPromptHook(absolute, runtime); state = ok ? "wired" : current.exists ? "drift" : "missing"; }\n    else { ok = current.exists && current.digest === entry.after?.digest; state = ok ? "managed" : current.exists ? "drift" : "missing"; }'
          if text.count(old_doctor) != 1:
            raise SystemExit('doctor strategy guard failed')
          text = text.replace(old_doctor, new_doctor, 1)

          old_uninstall = '''    if (entry.strategy === "mcp-json") {
      const result = removeMcpEntry(absolute);
      results.push({ path: entry.relativePath, action: result.changed ? "removed-mcp-entry" : "preserved-drift", drift: !result.changed });
      continue;
    }
    results.push({ path: entry.relativePath, action: "preserved-drift", drift: true });'''
          new_uninstall = '''    if (entry.strategy === "mcp-json") {
      const result = removeMcpEntry(absolute);
      results.push({ path: entry.relativePath, action: result.changed ? "removed-mcp-entry" : "preserved-drift", drift: !result.changed });
      continue;
    }
    if (entry.strategy === "prompt-hooks-json") {
      const result = removePromptHook(absolute, runtime);
      results.push({ path: entry.relativePath, action: result.changed ? "removed-prompt-hook" : "preserved-drift", drift: !result.changed });
      continue;
    }
    if (entry.strategy === "mcp-prompt-hooks-json") {
      const mcpResult = removeMcpEntry(absolute);
      const hookResult = removePromptHook(absolute, runtime);
      const changed = mcpResult.changed || hookResult.changed;
      results.push({ path: entry.relativePath, action: changed ? "removed-managed-json-entries" : "preserved-drift", drift: !changed });
      continue;
    }
    results.push({ path: entry.relativePath, action: "preserved-drift", drift: true });'''
          if text.count(old_uninstall) != 1:
            raise SystemExit('uninstall strategy guard failed')
          lifecycle.write_text(text.replace(old_uninstall, new_uninstall, 1))

          wiring = Path('cli/lib/runtime-mcp.js')
          text = wiring.read_text()
          marker = 'export function wireRuntimeMcp({ root = process.cwd(), runtime }) {'
          if text.count(marker) != 1:
            raise SystemExit('runtime-mcp helper marker missing')
          helper = r'''const mergePromptHook = ({ root, file, runtime, event }) => {
  const data = readJson(file);
  data.hooks = { ...(data.hooks || {}) };
  const groups = Array.isArray(data.hooks[event]) ? data.hooks[event] : [];
  const command = `ag-kit prompt-hook ${runtime}`;
  const exists = groups.some((group) => Array.isArray(group?.hooks) && group.hooks.some((handler) => handler?.command === command));
  if (!exists) groups.push({ hooks: [{ type: "command", command, timeout: 5 }] });
  data.hooks[event] = groups;
  writeJson(file, data);
  return { wired: true, event, file: portableRelative(root, file), privacy: "no-raw-prompt-persistence" };
};

'''
          text = text.replace(marker, helper + marker, 1)
          old = '  if (runtime === "antigravity") result = mergeMcp(path.join(target, ".agents", "mcp_config.json"));\n  else if (runtime === "claude") result = mergeMcp(path.join(target, ".mcp.json"), { ...stdio, env: {} });\n  else if (runtime === "gemini") result = mergeMcp(path.join(target, ".gemini", "settings.json"));'
          new = '''  if (runtime === "antigravity") result = mergeMcp(path.join(target, ".agents", "mcp_config.json"));
  else if (runtime === "claude") {
    result = mergeMcp(path.join(target, ".mcp.json"), { ...stdio, env: {} });
    const promptQuality = mergePromptHook({ root: target, file: path.join(target, ".claude", "settings.json"), runtime, event: "UserPromptSubmit" });
    return { ...result, file: portableRelative(target, result.file), promptQuality };
  }
  else if (runtime === "gemini") {
    result = mergeMcp(path.join(target, ".gemini", "settings.json"));
    const promptQuality = mergePromptHook({ root: target, file: path.join(target, ".gemini", "settings.json"), runtime, event: "BeforeAgent" });
    return { ...result, file: portableRelative(target, result.file), promptQuality };
  }'''
          if text.count(old) != 1:
            raise SystemExit('runtime-mcp branch guard failed')
          wiring.write_text(text.replace(old, new, 1))
          PY
      - name: Validate CLI and lifecycle ownership smoke
        working-directory: cli
        shell: bash
        run: |
          npm ci
          npm test
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { prepareRuntimeInstall, finalizeRuntimeInstall, uninstallRuntime } from './lib/runtime-lifecycle.js';
          import { wireRuntimeMcp } from './lib/runtime-mcp.js';

          for (const runtime of ['claude', 'gemini']) {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), `ag-kit-${runtime}-prompt-hook-`));
            try {
              const settings = runtime === 'claude' ? path.join(root, '.claude', 'settings.json') : path.join(root, '.gemini', 'settings.json');
              fs.mkdirSync(path.dirname(settings), { recursive: true });
              fs.writeFileSync(settings, JSON.stringify({ userSetting: true, hooks: { Custom: [{ hooks: [{ type: 'command', command: 'echo user' }] }] } }, null, 2));
              const prepared = prepareRuntimeInstall({ root, runtime });
              const wired = wireRuntimeMcp({ root, runtime });
              if (!wired.promptQuality?.wired) throw new Error(`${runtime}: prompt hook not wired`);
              finalizeRuntimeInstall({ prepared, mcp: wired });
              const installed = JSON.parse(fs.readFileSync(settings, 'utf8'));
              const event = runtime === 'claude' ? 'UserPromptSubmit' : 'BeforeAgent';
              const command = `ag-kit prompt-hook ${runtime}`;
              if (!installed.hooks[event].some((group) => group.hooks.some((hook) => hook.command === command))) throw new Error(`${runtime}: managed hook missing`);
              installed.userAfterInstall = true;
              fs.writeFileSync(settings, JSON.stringify(installed, null, 2));
              uninstallRuntime({ root, runtime });
              const remaining = JSON.parse(fs.readFileSync(settings, 'utf8'));
              if (!remaining.userSetting || !remaining.userAfterInstall || !remaining.hooks.Custom) throw new Error(`${runtime}: user drift not preserved`);
              if (remaining.hooks?.[event]?.some((group) => group.hooks?.some((hook) => hook.command === command))) throw new Error(`${runtime}: managed prompt hook survived uninstall`);
              if (runtime === 'gemini' && remaining.mcpServers?.['ag-kit']) throw new Error('gemini: managed MCP survived uninstall');
            } finally { fs.rmSync(root, { recursive: true, force: true }); }
          }
          NODE
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/lib/runtime-lifecycle.js cli/lib/runtime-mcp.js
          git diff --cached --check
          git commit -m "feat(prompt): wire owned Claude and Gemini pre-prompt hooks"
          git push origin HEAD:feat/lean-multiruntime-v2
