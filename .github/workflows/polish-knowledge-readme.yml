name: Polish knowledge preservation docs

on:
  push:
    branches:
      - feat/lean-multiruntime-v2
    paths:
      - .github/workflows/polish-knowledge-readme.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/lean-multiruntime-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Clarify cold knowledge preservation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const edits = [
            {
              file: 'README.md',
              anchor: '`shared/` is the source of truth. Runtime trees are projections/adapters, not independent forks.\n',
              insert: '\nLean does not mean discarded knowledge. The v1 baseline of **47 skills** is fully mapped in [`packs/legacy-knowledge-map.json`](packs/legacy-knowledge-map.json); deep guidance and supporting assets are preserved as cold references under `shared/skills/*/references/` and `packs/*/references/`, while current v2 contracts remain authoritative. `check:v2` fails if a mapped reference or asset disappears or if a legacy `SKILL.md` becomes discoverable again.\n',
            },
            {
              file: 'README-VI.md',
              anchor: '`shared/` là source of truth. Runtime tree chỉ là projection/adapter, không phải fork độc lập.\n',
              insert: '\nLean không có nghĩa là xóa tri thức. Baseline **47 skill** của v1 được map đầy đủ trong [`packs/legacy-knowledge-map.json`](packs/legacy-knowledge-map.json); deep guidance và supporting assets được giữ dưới dạng cold reference trong `shared/skills/*/references/` và `packs/*/references/`, còn contract v2 hiện tại vẫn là authoritative. `check:v2` sẽ fail nếu mapped reference/asset bị mất hoặc một legacy `SKILL.md` trở lại trạng thái có thể auto-discover.\n',
            },
          ];

          for (const { file, anchor, insert } of edits) {
            let text = fs.readFileSync(file, 'utf8');
            if (text.includes(insert.trim())) continue;
            const hits = text.split(anchor).length - 1;
            if (hits !== 1) throw new Error(`${file}: expected exactly one anchor, found ${hits}`);
            text = text.replace(anchor, `${anchor}${insert}`);
            fs.writeFileSync(file, text);
          }
          NODE

          npm run check:docs
          npm run check:v2
      - name: Commit README polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README-VI.md
          if git diff --cached --quiet; then
            echo "No README changes"
            exit 0
          fi
          git commit -m "docs: clarify cold knowledge preservation"
          git push origin HEAD:feat/lean-multiruntime-v2
