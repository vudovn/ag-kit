name: Regenerate Runtime Migration Metadata

on:
  push:
    branches: ["feat/runtime-platform-core"]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/runtime-platform-core

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Regenerate checked metadata
        run: |
          python .agents/scripts/generate_manifest.py .agents
          python .agents/scripts/dependency_graph.py .agents

      - name: Commit generated files when changed
        run: |
          if git diff --quiet -- .agents/manifest.json .agents/manifest.lock.json .agents/DEPENDENCY_GRAPH.md; then
            echo "Generated metadata is already synchronized."
            exit 0
          fi
          git config user.name "ag-kit-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/manifest.json .agents/manifest.lock.json .agents/DEPENDENCY_GRAPH.md
          git commit -m "chore: regenerate runtime metadata"
          git push origin HEAD:feat/runtime-platform-core
