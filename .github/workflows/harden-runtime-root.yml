name: Harden Runtime Root

on:
  push:
    branches:
      - feat/lean-multiruntime-v2
    paths:
      - cli/lib/runtime-lifecycle.js
      - .github/workflows/harden-runtime-root.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/lean-multiruntime-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply exact root-safety migration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'cli/lib/runtime-lifecycle.js';
          let text = fs.readFileSync(file, 'utf8');
          const changes = [
            [
              'import fs from "node:fs";\nimport path from "node:path";',
              'import fs from "node:fs";\nimport os from "node:os";\nimport path from "node:path";'
            ],
            [
              'const stateRoot = (root) => path.join(path.resolve(root), ".ag-kit");',
              'const safeProjectRoot = (root) => {\n  const resolved = path.resolve(root);\n  if (resolved === path.parse(resolved).root) throw new Error("filesystem root cannot be used as an AG Kit project");\n  if (resolved === path.resolve(os.homedir())) throw new Error("user home cannot be used as an AG Kit project");\n  return resolved;\n};\nconst stateRoot = (root) => path.join(safeProjectRoot(root), ".ag-kit");'
            ],
            [
              '  const projectRoot = path.resolve(root);\n  const id = `${runtime}-${timestamp()}`;',
              '  const projectRoot = safeProjectRoot(root);\n  const id = `${runtime}-${timestamp()}`;'
            ],
            [
              '  const projectRoot = path.resolve(root);\n  const manifest = readManifest(projectRoot, runtime);',
              '  const projectRoot = safeProjectRoot(root);\n  const manifest = readManifest(projectRoot, runtime);'
            ],
          ];
          let applied = 0;
          for (const [from, to] of changes) {
            const count = text.split(from).length - 1;
            if (!count) continue;
            text = text.split(from).join(to);
            applied++;
          }
          if (applied !== changes.length) {
            console.error(`Expected ${changes.length} exact migrations, applied ${applied}`);
            process.exit(1);
          }
          fs.writeFileSync(file, text);
          NODE
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- cli/lib/runtime-lifecycle.js; then
            echo "Runtime lifecycle already hardened"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/lib/runtime-lifecycle.js
          git commit -m "fix(runtime): reject root and home lifecycle targets"
          git push origin HEAD:feat/lean-multiruntime-v2
