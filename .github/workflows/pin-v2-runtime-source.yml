name: Pin V2 Runtime Source

on:
  push:
    branches:
      - feat/lean-multiruntime-v2
    paths:
      - .github/workflows/pin-v2-runtime-source.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/lean-multiruntime-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply exact source pin migration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'cli/lib/v2-cli.js';
          let text = fs.readFileSync(file, 'utf8');
          const replacements = [
            [
              'import { runConsensusAudit } from "./audit-consensus.js";\n\nconst REPO = "github:vudovn/ag-kit";\nconst withSource = async (branch, fn) => { const dir = fs.mkdtempSync(path.join(os.tmpdir(), "ag-kit-source-")); try { await downloadTemplate(branch ? `${REPO}#${branch}` : REPO, { dir, force: true }); return await fn(dir); } finally { fs.rmSync(dir, { recursive: true, force: true }); } };',
              'import { runConsensusAudit } from "./audit-consensus.js";\nimport { runtimeSourceSpec } from "./source-spec.js";\n\nconst withSource = async (branch, fn) => { const dir = fs.mkdtempSync(path.join(os.tmpdir(), "ag-kit-source-")); try { await downloadTemplate(runtimeSourceSpec(branch), { dir, force: true }); return await fn(dir); } finally { fs.rmSync(dir, { recursive: true, force: true }); } };'
            ],
            [
              '.option("-b, --branch <name>", "AG Kit source branch")',
              '.option("-b, --branch <name>", "Explicit AG Kit source branch/ref override")'
            ],
          ];
          let applied = 0;
          for (const [from, to] of replacements) {
            const count = text.split(from).length - 1;
            if (count !== 1) {
              console.error(`Expected one exact match, found ${count}: ${from.slice(0, 80)}`);
              process.exit(1);
            }
            text = text.replace(from, to);
            applied++;
          }
          if (applied !== replacements.length) process.exit(1);
          fs.writeFileSync(file, text);
          NODE
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- cli/lib/v2-cli.js; then
            echo "No migration needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/lib/v2-cli.js
          git commit -m "fix(runtime): pin single-runtime install source to release tag"
          git push origin HEAD:feat/lean-multiruntime-v2
