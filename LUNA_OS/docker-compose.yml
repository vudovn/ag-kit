services:
  # --- CORE LAYER ---
  luna-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luna-backend
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://luna-evo-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-haven}
      - WEBHOOK_API_KEY=${WEBHOOK_API_KEY}
      - BELASIS_API_URL=${BELASIS_API_URL}
      - BELASIS_API_KEY=${BELASIS_API_KEY}
      - BELASIS_MOCK=${BELASIS_MOCK:-true}
      - LUNA_MODE=${LUNA_MODE:-active}
      - ENV=${ENV:-development}
      - REDIS_URL=redis://luna-redis:6379/0
      - NTFY_TOPIC=${NTFY_TOPIC:-luna-alerts}
    volumes:
      - ./backend:/app
    networks:
      - luna-network
      - evolution-net
    depends_on:
      - luna-evo-api
      - luna-redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  luna-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luna-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - luna-network
    depends_on:
      - luna-backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- WHATSAPP LAYER (Evolution API) ---
  luna-evo-db:
    image: postgres:15-alpine
    container_name: luna-evo-db
    environment:
      - POSTGRES_USER=${EVO_DB_USER:-evolution}
      - POSTGRES_PASSWORD=${EVO_DB_PASSWORD}
      - POSTGRES_DB=evolution
    # [HARDENING] Porta externalizada foi REMOVIDA.
    # Banco de dados gotejando para a internet fechado. Fica estrito à evolution-net
    volumes:
      - evo_db_data:/var/lib/postgresql/data
    networks:
      - evolution-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U evolution -d evolution" ]
      interval: 10s
      timeout: 5s
      retries: 5

  luna-evo-api:
    image: atendai/evolution-api:v2.2.3
    container_name: luna-evo-api
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=http://localhost:8081
      - QRCODE_BASE64=true
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE
      - LOG_COLOR=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${EVO_DB_USER:-evolution}:${EVO_DB_PASSWORD}@luna-evo-db:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - REDIS_ENABLED=true
      - REDIS_URI=redis://luna-redis:6379
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://luna-redis:6379
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1031355444
      - DASHBOARD_ENABLED=true
    depends_on:
      - luna-evo-db
      - luna-redis
    volumes:
      - evo_instances:/evolution/instances
    networks:
      - evolution-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- MEMORY LAYER ---
  luna-redis:
    image: redis:7-alpine
    container_name: luna-redis
    # [HARDENING] Porta 6379 exposta ao host REMOVIDA.
    # Acesso restrito apenas aos containers do backend e evolution via DNS interno.
    volumes:
      - redis_data:/data
    networks:
      - evolution-net
      - luna-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  luna-network:
    driver: bridge
  evolution-net:
    driver: bridge

volumes:
  evo_db_data:
  evo_instances:
  redis_data:
