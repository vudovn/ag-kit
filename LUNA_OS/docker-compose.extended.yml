services:
  # ===== NOVA STACK v3.0 =====

  # 1. REDIS (Queue, Cache, Session) - DEBT #8
  redis:
    image: redis:7.2-alpine
    container_name: luna-redis
    ports:
      - "6380:6379"
    networks:
      - luna-network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 900 1 --save 300 10 --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MILVUS (Vector Database)
  milvus:
    image: milvusdb/milvus:v2.3.0
    container_name: luna-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      COMMON_STORAGETYPE: local
    networks:
      - luna-network
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 3. JAEGER (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: luna-jaeger
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686" # Web UI
    networks:
      - luna-network
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16686"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 4. POSTGRESQL (Database)
  postgres:
    image: postgres:15-alpine
    container_name: luna-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: luna
      POSTGRES_USER: ${DB_USER:-luna_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-luna_password}
    networks:
      - luna-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-luna_user} -d luna"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. WINDMILL (Workflow Automation)
  windmill:
    image: ghcr.io/windmill-labs/windmill:main
    container_name: luna-windmill
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-luna_user}:${DB_PASSWORD:-luna_password}@postgres:5432/windmill"
      RUST_LOG: "info"
      WORKER_TAGS: "python,bash"
    depends_on:
      - postgres
    networks:
      - luna-network
    volumes:
      - windmill_data:/root/.windmill
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 6. PROMETHEUS (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: luna-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - luna-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 7. GRAFANA (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: luna-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    depends_on:
      - prometheus
    networks:
      - luna-network
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 8. PGADMIN (Database Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: luna-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@luna.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    networks:
      - luna-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/misc/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  luna-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  milvus_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:
  windmill_data:
