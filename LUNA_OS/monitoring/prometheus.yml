global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'luna-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fastapi'
    static_configs:
      - targets: ['luna-backend:8000']

  - job_name: 'redis'
    static_configs:
      - targets: ['luna-redis:6379']

  - job_name: 'milvus'
    static_configs:
      - targets: ['luna-milvus:9091']

  # Jaeger does not expose Prometheus metrics by default
  # Uncomment if Jaeger is configured with --prometheus.server.host-port
  # - job_name: 'jaeger'
  #   static_configs:
  #     - targets: ['luna-jaeger:14269']
